<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto-scroll</title>
    <style>
      .app-container{
        height:100vh;
        display:flex;
        flex-direction:column;
        margin:0 auto;
        max-width:600px;
      }
      .chat-messages-container{
        overflow:scroll;
        flex-grow:1;
      }
    </style>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>

    <script type="text/babel">
      function ChatInput({chatMessages, setChatMessages, setIsLoading}){
        const [inputText, setInputText] = React.useState('');

        function saveInputMessage(event){
          setInputText(event.target.value);
        }

        async function sendMessage(){
          const newMessages = [...chatMessages, {
            sender:'user',
            message:inputText,
            id:crypto.randomUUID()
          }];

          setChatMessages(newMessages);
          setInputText('');
          setIsLoading(true);

          const response = await Chatbot.getResponseAsync(inputText);

          setChatMessages([...newMessages, {
            sender:'robot',
            message:response,
            id:crypto.randomUUID()
          }]);

          setIsLoading(false);
        }
        return (
          <div>
            <input placeholder="Send message to chatbot" size="30" onChange={saveInputMessage} value={inputText}/>
            <button onClick={sendMessage}>Send</button>
          </div>
        )
      }
      function ChatMessage({sender, message}){
        return <div>{sender}:{message}</div>
      }

      function useAutoScroll(dependencies){
        const elementRef = React.useRef(null);

        React.useEffect(()=>{
          const containerElem = elementRef.current;
          if(containerElem){
            containerElem.scrollTop = containerElem.scrollHeight;
          }
        }, dependencies);
        return elementRef;
      }
      function ChatMessages({chatMessages, isLoading}){

        const chatMessagesRef = useAutoScroll([chatMessages]);

        return (
          <div className="chat-messages-container" ref={chatMessagesRef}>
            {
              chatMessages.map(message=>{
                return (
                  <ChatMessage 
                    sender={message.sender}
                    message={message.message}
                    key={message.id}
                  />
                )
              })
            } 
            {isLoading && <ChatMessage 
                sender='robot'
                message='Loading...'
              />} 
          </div>
        )
      }
      function App(){
        const [chatMessages, setChatMessages] = React.useState([]);
        const [isLoading, setIsLoading] = React.useState(false);

        return (
          <div className="app-container">
            <ChatMessages 
              chatMessages={chatMessages}
              isLoading={isLoading}
            />
            <ChatInput 
              chatMessages={chatMessages}
              setChatMessages={setChatMessages}
              setIsLoading={setIsLoading}
            />
          </div>
        )
      }
      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App />)
    </script>
  </body>
</html>
