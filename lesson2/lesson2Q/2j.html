<!DOCTYPE html>
<html>
  <head>
    <title>React Lesson 2: QJ</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      function Product({product, price, discount, img}){
        return (
          <div>
            <img src={img} alt={product} width="200" />
            <p>{product}</p>
            {discount && <del>Price: ${price}</del>}
            {!discount && <p>Price: ${price}</p>}
            {discount && <p>Discount Price: ${discount}</p>}
            <div>
              <button>Add to Cart</button>
            </div> 
          </div>
        )
      }
      function App(props){
        return (
          <>
            <Product product="Cotton Socks" price="10.90" discount="5.45" img="./images/cotton-socks.png"/>
            <Product product="Plain T-Shirt" price="7.99" img="./images/plain-t-shirt.png"/>
          </>
        )
      }
      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
