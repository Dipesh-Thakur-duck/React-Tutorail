<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot</title>
    <link rel="stylesheet" href="chatbot_6.css">
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.13/dayjs.min.js"></script>

    <script type="text/babel">
      function ChatMessage({sender, message, time}){
        return (
          <div className={sender === 'user' ? 'user-message' : 'robot-message'}>
            {
              sender === 'user' ? 
              <div className="message">
                {message} 
                {time != null && <div className="message-time">{dayjs(time).format('h:mma')}</div>}
              </div> 
              : 
              <img src="./resources/robot.png" className="profile-img" />
            }
            {
              sender === 'user' ? <img src="./resources/user.png" className="profile-img" /> : <div className="message">
                {message} 
                {time != null && <div className="message-time">{dayjs(time).format('h:mma')}</div>}
              </div>
            }
          </div>
        )
      }
      function useAutoScroll(dependencies){
        const elementRef = React.useRef(null);

        React.useEffect(()=>{
          const element = elementRef.current;

          if(element){
            element.scrollTop = element.scrollHeight;
          }
        }, dependencies);

        return elementRef;

      }
      function ChatMessages({chatMessages, isLoading}){
        const elementRef = useAutoScroll([chatMessages]);
        return (
          <div className="chat-messages-container" ref={elementRef}>
            {
              chatMessages.map(message=>{
                return <ChatMessage 
                  sender={message.sender}
                  message={message.message}
                  time={message.time}
                  key={message.key}
                />
              })
            }
            {
              isLoading && <ChatMessage 
                sender='robot'
                message={<img src="./resources/loading-spinner.gif" className="spinner-img" />}
              />
            }
          </div>
        )
      }
      function ChatInput({chatMessages, setChatMessages, setIsLoading}){

        const [chatInput, setChatInput] = React.useState('');

        function saveMessage(event){
          setChatInput(event.target.value);
        }

        function clearMessages(){
          setChatMessages([]);
        }

        async function sendMessage(){
          const newMessages = [
            ...chatMessages, {
              sender:'user',
              message:chatInput,
              time:dayjs().valueOf(),
              key:crypto.randomUUID()
            }
          ];

          setChatMessages(newMessages);
          setIsLoading(true);
          setChatInput('');

          const response = await chatbot.getResponseAsync(chatInput);

          setChatMessages([
            ...newMessages,{
              sender:'robot',
              message:response,
              time:dayjs().valueOf(),
              key:crypto.randomUUID()
            }
          ]);

          setIsLoading(false);
        }

        return (
          <div className="chat-input-container">
            <input placeholder="Send message to chatbot" onChange={saveMessage} value={chatInput} className="input-field" />
            <button onClick={sendMessage} className="send-btn">Send</button>
            <button onClick={clearMessages} className="clear-btn">Clear</button>
          </div>
        )
      }
      function App(){
        const [chatMessages, setChatMessages] = React.useState(()=>{
          try{
            const messages = localStorage.getItem('chatMessages');
            return messages ? JSON.parse(messages) : [];
          } catch (err){
            return [];
          }
        });
        const [isLoading, setIsLoading] = React.useState(false);

        React.useEffect(()=>{
          localStorage.setItem('chatMessages', JSON.stringify(chatMessages));
        },[chatMessages]);

        return (
          <div className="app-container">
            {chatMessages.length === 0 ? <p className="welcome-message">Welcome to Chatbot! Send a message.</p> : null}
            <ChatMessages 
              chatMessages={chatMessages}
              isLoading={isLoading}
            />
            <ChatInput 
              chatMessages={chatMessages}
              setChatMessages={setChatMessages}
              setIsLoading={setIsLoading}
            />
          </div>
        )
      }
      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
