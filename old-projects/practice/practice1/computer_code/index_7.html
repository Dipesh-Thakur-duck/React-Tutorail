<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Async and the chatbot reply</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>

    <script type="text/babel">
      function ChatInput({chatMessages, setChatMessages, setIsLoading}){
        const [inputMessage, setInputMessage] = React.useState('');
        function saveInputMessage(event){
          setInputMessage(event.target.value);
        }

        async function sendMessage(){
          const newChatMessages = [
            ...chatMessages,
            {
              message:inputMessage,
              sender:'user',
              key:crypto.randomUUID()
            }
          ]
          setChatMessages(newChatMessages);
          setInputMessage('');
          setIsLoading(true);

          const response = await Chatbot.getResponseAsync(inputMessage);

          setChatMessages([
            ...newChatMessages,
            {
              message:response,
              sender:'robot',
              key:crypto.randomUUID()
            }
          ]);
          setIsLoading(false);

        }
        return (
          <>
            <input placeholder="Send messages to chatbot" size="30" onChange={saveInputMessage} value={inputMessage} />
            <button onClick={sendMessage}>Send</button>
          </>
        )
      }
      function ChatMessage({sender, message}){
        return <p>{sender}:{message}</p>
      }
      function App(){
        const [chatMessages, setChatMessages] = React.useState([]);
        const [isLoading, setIsLoading] = React.useState(false);
        return (
          <div>
            {
              chatMessages.map((message)=>{
                return <ChatMessage 
                  sender={message.sender}
                  message={message.message}
                  key={message.key}
                />
              })
            }
            {isLoading && <ChatMessage message="Loading..." sender="robot" />}
            <ChatInput 
              chatMessages={chatMessages}
              setChatMessages={setChatMessages}
              setIsLoading={setIsLoading}
            />
          </div>
        )
      }
      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
