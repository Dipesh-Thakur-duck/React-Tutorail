<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists with .map()</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>

    <script type="text/babel">
      function ChatInput(){
        return (
          <div>
            <input placeholder="Send message to chatbot!" size="30" />
            <button>Send</button>  
          </div>
        );
      }
      function ChatMessage({sender, message}){
        return <p>{sender}:{message}</p>
      }
      function App(){
        const chatMessages = [
          {message:'hello chatbot', sender:'user', id:'id1'},
          {message:'Hello! How can I help you?', sender:'robot', id:'id2'},
          {message:'what is the date today?', sender:'user', id:'id3'}
        ];
        return(
          <div>
            {chatMessages.map((chatMessage)=>{
              return (
                <ChatMessage 
                  message={chatMessage.message}
                  sender={chatMessage.sender}
                  key={chatMessage.id}
                />
              );
            })}
            <ChatInput />
          </div>
        )
      }
      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
