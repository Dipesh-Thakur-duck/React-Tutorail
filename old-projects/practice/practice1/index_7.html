<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Async and the chatbot reply</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>

    <script type="text/babel">
      function ChatMessage({sender, message}){
        return(
          <div>{sender}:{message}</div>
        )
      }
      function ChatInput({chatMessages, setChatMessages, setIsLoading}){

        const [inputMessage, setInputMessage] = React.useState('');
        function saveInputMessage(event){
          setInputMessage(event.target.value);
        }
        async function sendMessage(){
          const newMessages = [
            ...chatMessages,
            {
              sender:'user',
              message:inputMessage,
              key:crypto.randomUUID()
            }
          ];
          setChatMessages(newMessages);
          setInputMessage('');
          setIsLoading(true);

          const response = await Chatbot.getResponseAsync(inputMessage);

          setChatMessages([
            ...newMessages,
            {
              sender:'robot',
              message:response,
              key:crypto.randomUUID()
            }
          ]);

          setIsLoading(false);
        }
        
        return(
          <div>
            <input placeholder="Send message to chatbot" size="30" onChange={saveInputMessage} value={inputMessage} />
            <button onClick={sendMessage}>Send</button>
          </div>
        )
      }
      function App(){
        const [chatMessages, setChatMessages] = React.useState([]);
        const [isLoading, setIsLoading] = React.useState(false);
        return (
          <>
            {
              chatMessages.map(chatMessage=>{
                return <ChatMessage 
                  sender={chatMessage.sender}
                  message={chatMessage.message}
                  key={chatMessage.key}
                />
              })
            }
            {isLoading && <ChatMessage sender='robot' message='Loading...' />}
            <ChatInput 
              chatMessages={chatMessages}
              setChatMessages={setChatMessages}
              setIsLoading={setIsLoading}
            />
          </>
        )
      }
      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
