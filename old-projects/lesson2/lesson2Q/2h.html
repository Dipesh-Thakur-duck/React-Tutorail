<!DOCTYPE html>
<html>
  <head>
    <title>React Lesson 2: QH</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      function Product({product, price, discount}){
        return (
          <div>
            <p>{product}</p>
            {discount && <del>Price: ${price}</del>}
            {!discount && <p>Price: ${price}</p>}
            {discount && <p>Discount Price: ${discount}</p>}
            <button>Add to Cart</button>
          </div>
        )
      }
      function App(props){
        return (
          <>
            <Product product="Cotton Socks" price="10.90" discount="5.45" />
            <Product product="Plain T-Shirt" price="7.99" />
          </>
        )
      }
      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
